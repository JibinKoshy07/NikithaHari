<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" role="img" aria-label="Illustration of the couple seated together beneath a flower garland, viewed from behind">
  <defs>
    <radialGradient id="cGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%"   stop-color="#FFF6DE" stop-opacity=".95"/>
      <stop offset="60%"  stop-color="#F7E4BC" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#F7E4BC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cGround" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C9A227" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EBD08A"/>
      <stop offset="50%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8E6B14"/>
    </linearGradient>
    <linearGradient id="cFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#E8892B"/>
      <stop offset="55%"  stop-color="#F5C55E"/>
      <stop offset="100%" stop-color="#FFF6D4"/>
    </linearGradient>
    <linearGradient id="cSaree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A32B3C"/>
      <stop offset="55%"  stop-color="#8C2233"/>
      <stop offset="100%" stop-color="#6E1826"/>
    </linearGradient>
    <linearGradient id="cKurta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#F8EDD6"/>
      <stop offset="100%" stop-color="#E3CEA0"/>
    </linearGradient>
